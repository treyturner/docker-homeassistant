name: Publish images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even if the current release is already published
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/treyturner/homeassistant
  FORGEJO_IMAGE: forgejo.treyturner.info/treyturner/homeassistant

jobs:
  release:
    name: Resolve Home Assistant release
    runs-on: ubuntu-24.04
    outputs:
      build_date: ${{ steps.release.outputs.build_date }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Resolve current stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(gh api repos/home-assistant/core/releases/latest --jq '.tag_name')"
          if [[ ! "${version}" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Home Assistant release: ${version}" >&2
            exit 1
          fi
          echo "build_date=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  pr-build:
    name: Docker build (amd64)
    if: github.event_name == 'pull_request'
    needs: release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ needs.release.outputs.build_date }}
            HASS_RELEASE=${{ needs.release.outputs.version }}
            VERSION=${{ needs.release.outputs.version }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ needs.release.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=cacheonly
          provenance: false
          cache-from: type=gha,scope=homeassistant-amd64

  build:
    name: Build and publish amd64
    if: github.event_name != 'pull_request'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Forgejo registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: forgejo.treyturner.info
          username: treyturner
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Determine whether a build is needed
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          HASS_RELEASE: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" == "push" || "${FORCE_REBUILD}" == "true" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          current_release_is_latest() {
            local image="$1"
            local release_digest
            local latest_digest

            release_digest="$(docker buildx imagetools inspect \
              "${image}:${HASS_RELEASE}" --format '{{.Manifest.Digest}}' 2>/dev/null)" || return 1
            latest_digest="$(docker buildx imagetools inspect \
              "${image}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null)" || return 1

            [[ -n "${release_digest}" && "${release_digest}" == "${latest_digest}" ]]
          }

          if current_release_is_latest "${GHCR_IMAGE}" && \
            current_release_is_latest "${FORGEJO_IMAGE}"; then
            echo "Home Assistant ${HASS_RELEASE} is already latest in both registries."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Home Assistant ${HASS_RELEASE} needs to be published."
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        if: steps.decision.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ needs.release.outputs.build_date }}
            HASS_RELEASE=${{ needs.release.outputs.version }}
            VERSION=${{ needs.release.outputs.version }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ needs.release.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.FORGEJO_IMAGE }}:latest
            ${{ env.FORGEJO_IMAGE }}:${{ needs.release.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=homeassistant-amd64
          cache-to: type=gha,mode=max,scope=homeassistant-amd64
